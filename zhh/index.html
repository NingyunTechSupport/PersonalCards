<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="之槐 - 寧雲技术支持中心成员，软件部署与文档设计">
    <meta name="keywords" content="软件部署,Windows重装,系统美化,文档设计,山东淄博">
    <meta name="author" content="之槐">
    <meta name="theme-color" content="#DC2626">
    <meta property="og:title" content="之槐 | 寧雲技术支持中心">
    <meta property="og:description" content="专注软件部署、系统美化及文档设计服务">
    <meta property="og:type" content="profile">
    <title>之槐 | 寧雲技术支持中心 - 个人名片</title>
    <!-- 标签页图标：纯黑色半身像 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='10' r='8' fill='%23000000'/><rect x='8' y='18' width='16' height='10' rx='2' fill='%23000000'/></svg>">

    <style>
        /* ============ CSS 变量 / 设计令牌（红蓝白配色） ============ */
        :root {
            --color-primary: #DC2626;
            --color-primary-light: #F87171;
            --color-primary-dark: #B91C1C;
            --color-accent: #1E3A8A;
            --color-accent-light: #3B82F6;
            --color-accent-dark: #1E40AF;
            --color-bg-start: #EFF6FF;
            --color-bg-mid: #F8FAFC;
            --color-bg-end: #FEF2F2;
            --color-card-bg: #FFFFFF;
            --color-card-bg-secondary: #F1F5F9;
            --color-text: #0F172A;
            --color-text-secondary: #334155;
            --color-text-muted: #64748B;
            --color-border: #E2E8F0;
            --color-tag-bg: #EFF6FF;
            --color-tag-text: #1E3A8A;
            --color-tag-border: #BFDBFE;
            --color-shadow: rgba(0,0,0,0.04);
            --color-shadow-lg: rgba(0,0,0,0.1);
            --color-avatar-border: #E2E8F0;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            --font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            /* 与寧雲名片完全一致的亮色调渐变背景 */
            background: linear-gradient(160deg, var(--color-bg-start) 0%, var(--color-bg-mid) 35%, var(--color-bg-end) 70%, var(--color-bg-start) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== 动态浮动光晕（与寧雲名片完全一致） ===== */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
            filter: blur(80px);
            will-change: transform;
        }
        .bg-decoration--1 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(220,38,38,0.15) 0%, transparent 70%);
            top: -15%; right: -10%;
            animation: floatSlow 20s ease-in-out infinite;
        }
        .bg-decoration--2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(30,58,138,0.15) 0%, transparent 70%);
            bottom: -12%; left: -8%;
            animation: floatSlow 25s ease-in-out infinite reverse;
        }
        .bg-decoration--3 {
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
            top: 40%; left: 55%;
            animation: floatSlow 22s ease-in-out infinite 3s;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.08); }
            50% { transform: translate(-20px, 25px) scale(0.94); }
            75% { transform: translate(-35px, -20px) scale(1.04); }
        }

        .card {
            background: var(--color-card-bg);
            border-radius: var(--radius-xl);
            padding: 36px 30px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px var(--color-shadow-lg);
            border: 1px solid var(--color-border);
            position: relative;
            overflow: hidden;
            z-index: 1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-accent) 100%);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
            text-align: center;
        }
        @media (min-width: 400px) {
            .header { flex-wrap: nowrap; text-align: left; justify-content: flex-start; }
        }

        .avatar-wrapper { flex-shrink: 0; position: relative; }
        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%; object-fit: cover;
            border: 4px solid var(--color-avatar-border);
            box-shadow: 0 4px 12px var(--color-shadow);
            background: #E2E8F0;
        }
        .avatar-placeholder {
            width: 90px; height: 90px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            border: 4px solid var(--color-avatar-border);
        }
        .status-dot {
            position: absolute;
            bottom: 6px; right: 6px;
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 3px solid #fff;
            animation: colorCycle 2s ease-in-out infinite alternate, pulseStatus 2.5s ease-in-out infinite;
        }

        @keyframes colorCycle {
            0% { background-color: #DC2626; }
            100% { background-color: #1E3A8A; }
        }
        @keyframes pulseStatus {
            0%, 100% { box-shadow: 0 0 0 2px rgba(34,197,94,0.3); }
            50% { box-shadow: 0 0 0 8px rgba(34,197,94,0.08); }
        }

        .profile-info h1 { font-size: 1.7rem; font-weight: 700; color: var(--color-text); }
        .profile-info .title { font-size: 1rem; color: var(--color-primary); font-weight: 600; margin-top: 4px; }
        .profile-info .company { font-size: 0.875rem; color: var(--color-text-muted); margin-top: 2px; }

        .divider { height: 1px; background: var(--color-border); margin: 20px 0; }

        .bio {
            font-size: 0.9rem; color: var(--color-text-secondary);
            background: var(--color-card-bg-secondary);
            padding: 14px 16px; border-radius: var(--radius-md);
            border-left: 3px solid var(--color-primary);
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--color-text-muted); margin-bottom: 10px;
        }

        .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .skill-tag {
            background: var(--color-tag-bg); color: var(--color-tag-text);
            border: 1px solid var(--color-tag-border); padding: 5px 14px;
            border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 500;
            transition: all var(--transition);
        }
        .skill-tag.highlight { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
        .skill-tag:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--color-shadow); }

        .contact-list {
            list-style: none; display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 20px;
        }
        @media (max-width: 400px) { .contact-list { grid-template-columns: 1fr; } }

        .contact-item {
            background: var(--color-card-bg-secondary); border-radius: var(--radius-sm);
            padding: 10px 12px; display: flex; align-items: center; gap: 8px;
            font-size: 0.85rem; color: var(--color-text-secondary);
            text-decoration: none; transition: all var(--transition);
            border: 1px solid transparent; position: relative; overflow: hidden;
        }
        .contact-item--link { cursor: pointer; }
        .contact-item--link:hover {
            background: var(--color-tag-bg); border-color: var(--color-tag-border);
            transform: translateX(3px); color: var(--color-primary);
        }
        .contact-item--link::before {
            content: ''; position: absolute;
            left: 0; top: 10%; height: 80%; width: 3px;
            background: linear-gradient(to bottom, #DC2626, #FFFFFF);
            border-radius: 2px;
            transform: scaleY(0); transition: transform 0.3s ease;
        }
        .contact-item--link:hover::before { transform: scaleY(1); }
        .contact-icon {
            flex-shrink: 0; width: 34px; height: 34px;
            background: #F1F5F9; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition);
        }
        .contact-item--link:hover .contact-icon {
            background: var(--color-primary); color: #fff; transform: scale(1.08);
        }
        .contact-text { flex: 1; min-width: 0; }
        .contact-label { font-size: 0.7rem; color: var(--color-text-muted); display: block; }
        .contact-value { font-weight: 500; color: var(--color-text); word-break: break-all; }

        .social-links {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-bottom: 20px; justify-content: center;
        }
        .social-btn {
            flex: 0 1 auto; background: var(--color-card-bg-secondary);
            border: 1px solid var(--color-border); border-radius: var(--radius-full);
            padding: 8px 24px; text-align: center; font-weight: 500;
            color: var(--color-text-secondary); text-decoration: none;
            font-size: 0.85rem; transition: all var(--transition); cursor: pointer;
        }
        .social-btn:hover { background: var(--color-accent); color: #fff; border-color: var(--color-accent); transform: translateY(-2px); }
        .social-btn.bilibili:hover { background: #FB7299; border-color: #FB7299; }

        .footer-text {
            text-align: center; margin-top: 20px; font-size: 0.75rem;
            color: var(--color-text-muted); padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        /* ============ 弹窗通用样式 ============ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--color-card-bg); border-radius: var(--radius-lg);
            max-width: 360px; width: 100%; padding: 30px 20px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); position: relative; text-align: center;
            border: 1px solid var(--color-border);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-top: 4px solid transparent;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute; top: 12px; right: 16px; background: none; border: none;
            font-size: 24px; line-height: 1; cursor: pointer; color: var(--color-text-secondary);
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--color-primary); }
        .modal-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 16px; }

        .confirm-link {
            display: inline-block; font-weight: 600; word-break: break-all;
            margin: 10px 0; padding: 6px 16px; border-radius: 20px;
            text-decoration: none; cursor: pointer; color: #fff;
            background: #DC2626; transition: filter 0.2s;
        }
        .confirm-link:hover { filter: brightness(0.9); }

        .modal-buttons {
            display: flex; gap: 12px; justify-content: center; margin-top: 20px;
        }
        .modal-buttons .btn {
            flex: 1; padding: 10px 0; border-radius: var(--radius-full);
            font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none;
            transition: background var(--transition);
        }
        .btn-cancel { background: var(--color-card-bg-secondary); color: var(--color-text-secondary); }
        .btn-cancel:hover { background: #cbd5e1; }
        .btn-confirm { background: var(--color-primary); color: #fff; }
        .btn-confirm:hover { filter: brightness(0.9); }
    </style>
</head>
<body>
    <!-- 动态背景装饰（与寧雲名片完全一致） -->
    <div class="bg-decoration bg-decoration--1" aria-hidden="true"></div>
    <div class="bg-decoration bg-decoration--2" aria-hidden="true"></div>
    <div class="bg-decoration bg-decoration--3" aria-hidden="true"></div>

    <main class="card">
        <div class="header">
            <div class="avatar-wrapper">
                <img class="avatar" src="./avatar.jpg" alt="之槐头像" 
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

            </div>
        </div>

        <div class="divider"></div>

        <p class="bio">
            专注软件部署与文档排版设计，擅长 Windows 系统重装与美化，耐心解决各类软件安装及文字处理需求。
        </p>

        <div class="section-label">技术方向</div>
        <div class="skills">
            <span class="skill-tag highlight">软件部署</span>
            <span class="skill-tag">Windows 重装</span>
            <span class="skill-tag">系统美化</span>
            <span class="skill-tag">文字设计</span>
        </div>

        <div class="section-label">联系方式</div>
        <div class="contact-list">
            <a href="mailto:563602369@qq.com" class="contact-item contact-item--link">
                <span class="contact-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
                </span>
                <span class="contact-text">
                    <span class="contact-label">邮箱</span>
                    <span class="contact-value">563602369@qq.com</span>
                </span>
            </a>
            <a href="tencent://message/?uin=563602369" class="contact-item contact-item--link">
                <span class="contact-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                </span>
                <span class="contact-text">
                    <span class="contact-label">QQ</span>
                    <span class="contact-value">563602369</span>
                </span>
            </a>
            <span class="contact-item contact-item--link">
                <span class="contact-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </span>
                <span class="contact-text">
                    <span class="contact-label">地区</span>

                </span>
            </span>
            <a href="https://www.ningyun.sd.cn" target="_blank" rel="noopener" class="contact-item contact-item--link">
                <span class="contact-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                </span>

                    <span class="contact-label">官网</span>

        </div>

        <div class="section-label">视频平台</div>
        <div class="social-links">
            <a href="https://space.bilibili.com/2060315070" target="_blank" rel="noopener"
               class="social-btn bilibili external-link"
               data-confirm-title="即将前往B站"
               data-confirm-label="B站主页"
               data-confirm-color="#FB7299"
               aria-label="B站主页">B站主页</a>

        <div class="footer-text">
            ©2026 之槐 · 寧雲技术支持中心
        </div>
    </main>

    <!-- 二次确认弹窗（动态强调色） -->
    <div class="modal-overlay" id="confirmModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" id="confirmContent">
            <button class="modal-close" id="closeConfirmBtn" aria-label="关闭弹窗">&times;</button>
            <div class="modal-title" id="confirmTitle">即将前往外部链接</div>
            <a href="javascript:void(0);" class="confirm-link" id="confirmLink" target="_blank" rel="noopener"></a>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelBtn">取消</button>
                <button class="btn btn-confirm" id="confirmBtn">确认跳转</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const confirmModal = document.getElementById('confirmModal');
            const confirmContent = document.getElementById('confirmContent');
            const confirmTitle = document.getElementById('confirmTitle');
            const confirmLink = document.getElementById('confirmLink');
            const confirmBtn = document.getElementById('confirmBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const closeConfirmBtn = document.getElementById('closeConfirmBtn');
            let pendingUrl = '';

            const externalLinks = document.querySelectorAll('.external-link');

            function openConfirmModal(url, title, label, color) {
                pendingUrl = url;
                confirmTitle.textContent = title || '即将打开外部链接';
                confirmLink.textContent = label || url;
                confirmContent.style.borderTopColor = color;
                confirmLink.style.backgroundColor = color;
                confirmBtn.style.backgroundColor = color;
                closeConfirmBtn.addEventListener('mouseenter', function() { this.style.color = color; });
                closeConfirmBtn.addEventListener('mouseleave', function() { this.style.color = ''; });
                confirmModal.classList.add('active');
                confirmModal.setAttribute('aria-hidden', 'false');
                cancelBtn.focus();
            }

            function closeConfirmModal() {
                confirmModal.classList.remove('active');
                confirmModal.setAttribute('aria-hidden', 'true');
                pendingUrl = '';
            }

            externalLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const url = this.getAttribute('href');
                    const title = this.getAttribute('data-confirm-title') || '';
                    const label = this.getAttribute('data-confirm-label') || '';
                    const color = this.getAttribute('data-confirm-color') || '#DC2626';
                    if (url) openConfirmModal(url, title, label, color);
                });
            });

            confirmBtn.addEventListener('click', function() {
                if (pendingUrl) window.open(pendingUrl, '_blank', 'noopener');
                closeConfirmModal();
            });

            confirmLink.addEventListener('click', function(e) {
                e.preventDefault();
                if (pendingUrl) window.open(pendingUrl, '_blank', 'noopener');
                closeConfirmModal();
            });

            cancelBtn.addEventListener('click', closeConfirmModal);
            closeConfirmBtn.addEventListener('click', closeConfirmModal);
            confirmModal.addEventListener('click', function(e) {
                if (e.target === confirmModal) closeConfirmModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && confirmModal.classList.contains('active')) closeConfirmModal();
            });
        })();
    </script>
</body>
