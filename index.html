<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名片导航 | 寧雲技术支持中心</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='10' r='8' fill='%23000000'/><rect x='8' y='18' width='16' height='10' rx='2' fill='%23000000'/></svg>">
    <style>
        :root {
            --color-primary: #DC2626;
            --color-accent: #1E3A8A;
            --color-bg-dark: #0a0e17;
            --color-card: #1a1f2e;
            --color-text: #F1F5F9;
            --color-text-secondary: #CBD5E1;
            --color-border: #2d3548;
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: var(--color-bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Canvas 全屏背景 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }
        .logo span { color: var(--color-primary); }

        .nav-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .nav-card {
            flex: 1 1 260px;
            max-width: 320px;
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            text-align: center;
            text-decoration: none;
            color: var(--color-text);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid var(--color-border);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .nav-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 48px rgba(220,38,38,0.35);
            border-color: var(--color-primary);
        }

        .nav-card h2 { font-size: 1.6rem; margin-bottom: 0.5rem; }
        .nav-card p { color: var(--color-text-secondary); font-size: 0.95rem; line-height: 1.5; margin-top: 0.5rem; }

        .badge {
            display: inline-block;
            background: rgba(30,58,138,0.2);
            color: #60a5fa;
            border: 1px solid var(--color-accent);
            border-radius: 50px;
            padding: 0.35rem 1.1rem;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 1rem;
            letter-spacing: 0.02em;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748B;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 粒子动画画布 -->
    <canvas id="particleCanvas"></canvas>

    <div class="logo">寧雲技术支持中心 <span>名片导航</span></div>

    <div class="nav-cards">
        <a href="./ny/" class="nav-card">
            <h2>寧雲</h2>
            <p>负责人 · 技术支持</p>
            <p>Windows系统定制、优化与软件部署</p>
            <span class="badge">进入名片</span>
        </a>
        <a href="./zhh/" class="nav-card">
            <h2>之槐</h2>
            <p>软件部署 · 文档设计</p>
            <p>Windows系统重装、美化与文字处理</p>
            <span class="badge">进入名片</span>
        </a>
    </div>

    <div class="footer">© 2026 寧雲技术支持中心</div>

    <script>
        (function() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');

            let w, h;
            const particles = [];
            const particleCount = 120; // 粒子数量

            // 粒子颜色池：红、蓝、白
            const colors = [
                'rgba(220, 38, 38, 0.8)',   // 红
                'rgba(220, 38, 38, 0.5)',
                'rgba(30, 58, 138, 0.8)',   // 蓝
                'rgba(30, 58, 138, 0.5)',
                'rgba(59, 130, 246, 0.7)',  // 浅蓝
                'rgba(59, 130, 246, 0.4)',
                'rgba(255, 255, 255, 0.6)', // 白
                'rgba(255, 255, 255, 0.3)',
            ];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            function createParticle() {
                return {
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2.5 + 1,          // 半径 1~3.5px
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 0.6,      // 水平速度
                    vy: (Math.random() - 0.5) * 0.6,      // 垂直速度
                    opacity: Math.random() * 0.7 + 0.3,   // 初始透明度
                    fadeSpeed: (Math.random() - 0.5) * 0.02, // 透明度变化速度
                };
            }

            function initParticles() {
                particles.length = 0;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(createParticle());
                }
            }

            function updateParticles() {
                for (let p of particles) {
                    // 移动
                    p.x += p.vx;
                    p.y += p.vy;

                    // 边界反弹
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;

                    // 透明度呼吸
                    p.opacity += p.fadeSpeed;
                    if (p.opacity >= 1 || p.opacity <= 0.2) {
                        p.fadeSpeed *= -1;
                    }
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, w, h);

                for (let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color.replace(/[\d.]+\)$/, p.opacity + ')');
                    ctx.fill();
                }

                // 绘制粒子间的连线（增加动态感）
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            const lineOpacity = (1 - dist / 120) * 0.12;
                            ctx.strokeStyle = `rgba(255, 255, 255, ${lineOpacity})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                updateParticles();
                drawParticles();
                requestAnimationFrame(animate);
            }

            // 初始化
            resize();
            initParticles();
            animate();

            // 窗口大小变化时重新调整
            window.addEventListener('resize', () => {
                resize();
                initParticles();
            });
        })();
    </script>
</body>
</html>
